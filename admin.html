<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>UNEX Admin Dashboard</title>

<style>
body{
font-family:Arial,sans-serif;
background:#f4f7fb;
margin:0;
padding:20px;
}

.container{
max-width:700px;
margin:auto;
background:white;
padding:25px;
border-radius:10px;
box-shadow:0 5px 15px rgba(0,0,0,.1);
}

h1{
text-align:center;
color:#0A3D91;
}

input,select{
width:100%;
padding:12px;
margin:10px 0;
font-size:16px;
border:1px solid #ccc;
border-radius:6px;
box-sizing:border-box;
}

button{
background:#FF7A00;
color:white;
border:none;
padding:14px;
width:100%;
font-size:18px;
border-radius:8px;
cursor:pointer;
}

#output{
margin-top:20px;
padding:15px;
background:#eef;
border-radius:8px;
white-space:pre-wrap;
}
</style>
</head>

<body>

<div class="container">

<h1>UNEX Admin Dashboard</h1>
<div id="loginBox">
  <input id="adminEmail" type="email" placeholder="Admin Email">
  <input id="adminPassword" type="password" placeholder="Admin Password">
  <button onclick="loginAdmin()">Login</button>
  <p id="loginMessage"></p>
</div>

<div id="adminArea" style="display:none;">
<input id="tracking" placeholder="Tracking Number">

<input id="origin" placeholder="Origin">

<input id="destination" placeholder="Destination">

<select id="status">
<option>Shipment Created</option>
<option>In Transit</option>
<option>Out for Delivery</option>
<option>Delivered</option>
<option>Held at Customs</option>
</select>

<input id="delivery" placeholder="Estimated Delivery">

<button onclick="saveShipment()">Save Shipment</button>

<div id="output"></div>

</div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>
const SUPABASE_URL = "https://kwmverimbcosdshjvshc.supabase.co";
const SUPABASE_PUBLISHABLE_KEY = "sb_publishable_Y_9BOh5Hmb-Zf-rrflPKzw_WV9_Rd5A";

const supabaseClient = window.supabase.createClient(
  SUPABASE_URL,
  SUPABASE_PUBLISHABLE_KEY
);

async function loginAdmin() {
  const email = document.getElementById("adminEmail").value.trim();
  const password = document.getElementById("adminPassword").value;

  const { error } = await supabaseClient.auth.signInWithPassword({
    email: email,
    password: password
  });

  if (error) {
    document.getElementById("loginMessage").textContent =
      "Login failed: " + error.message;
    return;
  }

  document.getElementById("loginBox").style.display = "none";
  document.getElementById("adminArea").style.display = "block";
}

async function saveShipment() {

  const shipment = {
    Tracking: document.getElementById("tracking").value.trim(),
    Origin: document.getElementById("origin").value.trim(),
    Destination: document.getElementById("destination").value.trim(),
    Status: document.getElementById("status").value,
    delivery: document.getElementById("delivery").value.trim()
  };

  if (!shipment.Tracking) {
    alert("Please enter a tracking number.");
    return;
  }

  const { data, error } = await supabaseClient
  .from("shipments")
  .upsert([shipment], { onConflict: "Tracking" })
  .select();
  if (error) {
    alert("Could not save shipment: " + error.message);
    return;
  }

  document.getElementById("output").textContent =
    "Shipment saved successfully!\n\n" +
    JSON.stringify(data[0], null, 2);
}
</script>
<h2 style="margin-top:40px;">Existing Shipments</h2>

<div id="shipmentList">
  Loading shipments...
</div>

<script>
async function loadShipments() {

  const { data, error } = await supabaseClient
    .from("shipments")
    .select("id, Tracking, Origin, Destination, Status, delivery")
    .order("id", { ascending: false });

  if (error) {
    document.getElementById("shipmentList").textContent =
      "Could not load shipments: " + error.message;
    return;
  }

  const list = document.getElementById("shipmentList");

  if (!data || data.length === 0) {
    list.textContent = "No shipments yet.";
    return;
  }

  list.innerHTML = data.map(shipment => `
    <div style="
      border:1px solid #ddd;
      padding:15px;
      margin:10px 0;
      border-radius:10px;
    ">
      <strong>Tracking:</strong> ${shipment.Tracking}<br>
      <strong>Origin:</strong> ${shipment.Origin}<br>
      <strong>Destination:</strong> ${shipment.Destination}<br>
      <strong>Status:</strong> ${shipment.Status}<br>
      <strong>Delivery:</strong> ${shipment.delivery}
    </div>
  `).join("");
}

loadShipments();
</script>
</body>
</html>
