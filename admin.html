<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>UNEX Global Logistics - Admin</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>

body{
font-family:Arial,sans-serif;
background:#f4f7fb;
margin:0;
padding:20px;
}

.container{
max-width:700px;
margin:auto;
}

.card{
background:white;
padding:25px;
border-radius:12px;
margin-bottom:20px;
box-shadow:0 3px 12px rgba(0,0,0,.08);
}

h1,h2{
margin-top:0;
}

input,select,textarea{
width:100%;
padding:12px;
margin:8px 0 15px;
box-sizing:border-box;
border:1px solid #ccc;
border-radius:7px;
font-size:16px;
font-family:Arial,sans-serif;
}

textarea{
min-height:110px;
resize:vertical;
}

button{
padding:12px 18px;
border:none;
border-radius:7px;
cursor:pointer;
font-size:16px;
margin-right:8px;
margin-top:5px;
}

button:hover{
opacity:.9;
}

.primary{
background:#0b63ce;
color:white;
width:100%;
}

.edit{
background:#f0ad00;
color:white;
}

.delete{
background:#d93025;
color:white;
}

.history-button{
background:#0A3D91;
color:white;
}

.logout{
background:#555;
color:white;
width:100%;
margin-top:15px;
}

.shipment{
border:1px solid #ddd;
padding:15px;
margin:12px 0;
border-radius:10px;
background:#fafafa;
}

.history{
margin-top:15px;
padding:15px;
background:#fff;
border:1px solid #dfe3e8;
border-radius:8px;
}

.history-title{
font-weight:bold;
color:#0A3D91;
margin-bottom:12px;
}

.history-item{
border-left:3px solid #22a447;
padding-left:12px;
margin-bottom:15px;
}

.history-item:last-child{
margin-bottom:0;
}

.history-date{
font-size:13px;
color:#777;
margin-bottom:4px;
}

.history-status{
font-weight:bold;
color:#0A3D91;
font-size:16px;
}

.history-note{
margin-top:4px;
font-size:14px;
color:#444;
}

.history-loading{
color:#666;
padding:8px 0;
}

.history-error{
color:#b00000;
background:#fff0f0;
padding:10px;
border-radius:6px;
}

.customer-box{
background:#eef7ff;
border-left:4px solid #087ff5;
padding:14px;
border-radius:7px;
margin-top:5px;
margin-bottom:15px;
}

.customer-box strong{
display:block;
color:#0A3D91;
margin-bottom:4px;
}

.customer-box span{
font-size:13px;
color:#526170;
}

#output{
margin-top:15px;
font-weight:bold;
}

.hidden{
display:none;
}

</style>

</head>

<body>

<div class="container">


<!-- LOGIN -->

<div id="loginCard" class="card">

<h1>UNEX Admin</h1>

<p>Login to manage shipments.</p>

<label>Email</label>

<input
type="email"
id="email"
placeholder="Admin email"
>

<label>Password</label>

<input
type="password"
id="password"
placeholder="Password"
>

<button
class="primary"
onclick="loginAdmin()"
>
Login
</button>

<div id="loginMessage"></div>

</div>


<!-- ADMIN -->

<div id="adminArea" class="hidden">


<!-- SHIPMENT FORM -->

<div class="card">

<h2>Manage Shipment</h2>

<input
type="hidden"
id="editingId"
>

<label>Tracking Number</label>

<input
type="text"
id="tracking"
placeholder="Example: UNEX22541"
>


<label>Origin</label>

<input
type="text"
id="origin"
placeholder="Example: New York"
>


<label>Destination</label>

<input
type="text"
id="destination"
placeholder="Example: Germany"
>


<label>Status</label>

<select id="status">

<option value="Shipment Created">
Shipment Created
</option>

<option value="In Transit">
In Transit
</option>

<option value="Arrived at Facility">
Arrived at Facility
</option>

<option value="Held at Customs">
Held at Customs
</option>

<option value="Out for Delivery">
Out for Delivery
</option>

<option value="Delivered">
Delivered
</option>

</select>


<label>Estimated Delivery</label>

<input
type="text"
id="delivery"
placeholder="Example: 03/04/2026"
>


<!-- CUSTOMER MESSAGE -->

<label>
Customer Update Message
</label>

<textarea
id="customerMessage"
placeholder="Example: Your shipment has departed the origin facility and is now in transit."
></textarea>

<div class="customer-box">

<strong>Customer communication</strong>

<span>
This message will appear on the customer's tracking page as their latest shipment update.
</span>

</div>


<button
class="primary"
onclick="saveShipment()"
>
Save Shipment
</button>


<button
class="logout"
onclick="logoutAdmin()"
>
Logout
</button>


<div id="output"></div>

</div>


<!-- EXISTING SHIPMENTS -->

<div class="card">

<h2>Existing Shipments</h2>

<div id="shipmentList">
Loading shipments...
</div>

</div>

</div>

</div>


<script>


/* =========================
SUPABASE
========================= */

const SUPABASE_URL =
"https://kwmverimbcosdshjvshc.supabase.co";

const SUPABASE_PUBLISHABLE_KEY =
"sb_publishable_Y_9BOh5Hmb-Zf-rrflPKzw_WV9_Rd5A";

const supabaseClient =
window.supabase.createClient(
SUPABASE_URL,
SUPABASE_PUBLISHABLE_KEY
);


/* =========================
LOGIN
========================= */

async function loginAdmin(){

const email =
document.getElementById("email")
.value
.trim();

const password =
document.getElementById("password")
.value;

const message =
document.getElementById("loginMessage");

if(!email || !password){

message.textContent =
"Please enter your email and password.";

return;

}

message.textContent =
"Logging in...";

const {data,error} =
await supabaseClient.auth
.signInWithPassword({

email:email,

password:password

});

if(error){

message.textContent =
"Login failed: " +
error.message;

return;

}

if(!data.session){

message.textContent =
"Login failed. No session created.";

return;

}

message.textContent="";

document.getElementById("loginCard")
.classList.add("hidden");

document.getElementById("adminArea")
.classList.remove("hidden");

await loadShipments();

}


/* =========================
LOGOUT
========================= */

async function logoutAdmin(){

await supabaseClient.auth.signOut();

document.getElementById("adminArea")
.classList.add("hidden");

document.getElementById("loginCard")
.classList.remove("hidden");

document.getElementById("shipmentList")
.innerHTML="";

document.getElementById("output")
.textContent="";

document.getElementById("email")
.value="";

document.getElementById("password")
.value="";

}


/* =========================
SAVE SHIPMENT
========================= */

async function saveShipment(){

const editingId =
document.getElementById("editingId")
.value;

const tracking =
document.getElementById("tracking")
.value
.trim();

const origin =
document.getElementById("origin")
.value
.trim();

const destination =
document.getElementById("destination")
.value
.trim();

const status =
document.getElementById("status")
.value;

const delivery =
document.getElementById("delivery")
.value
.trim();

const customerMessage =
document.getElementById("customerMessage")
.value
.trim();


if(!tracking){

alert(
"Please enter a tracking number."
);

return;

}

if(!origin || !destination){

alert(
"Please enter the origin and destination."
);

return;

}


const shipment = {

Tracking:tracking,

Origin:origin,

Destination:destination,

Status:status,

delivery:delivery

};


let oldStatus=null;


/* =========================
CHECK EXISTING
========================= */

if(editingId){

const {
data:existing,
error:existingError
} =
await supabaseClient
.from("shipments")
.select(
"Tracking, Status"
)
.eq("id",editingId)
.maybeSingle();

if(existingError){

alert(
"Could not check existing shipment: " +
existingError.message
);

return;

}

if(existing){

oldStatus=existing.Status;

}

}

else{

const {
data:existing,
error:existingError
} =
await supabaseClient
.from("shipments")
.select(
"Tracking, Status"
)
.eq("Tracking",tracking)
.maybeSingle();

if(existingError){

alert(
"Could not check existing shipment: " +
existingError.message
);

return;

}

if(existing){

oldStatus=existing.Status;

}

}


let result;


/* =========================
EDIT
========================= */

if(editingId){

result =
await supabaseClient
.from("shipments")
.update(shipment)
.eq("id",editingId)
.select();

}

/* =========================
CREATE
========================= */

else{

result =
await supabaseClient
.from("shipments")
.upsert(
[shipment],
{
onConflict:"Tracking"
}
)
.select();

}


if(result.error){

alert(
"Could not save shipment: " +
result.error.message
);

return;

}


/* =========================
CREATE CUSTOMER UPDATE
========================= */

const statusChanged =
oldStatus === null ||
oldStatus !== status;


/*
Create a history record when:

1. Shipment is new
2. Status changed
3. Admin entered a customer message
*/

if(
statusChanged ||
customerMessage
){

let note="";


if(customerMessage){

note=customerMessage;

}

else if(oldStatus===null){

note="Shipment created";

}

else{

note=
"Shipment status updated from " +
oldStatus +
" to " +
status;

}


const historyRecord={

tracking:tracking,

status:status,

note:note

};


const {
error:historyError
} =
await supabaseClient
.from("shipment_history")
.insert(
[historyRecord]
);


if(historyError){

console.error(
"History error:",
historyError
);

document.getElementById("output")
.textContent =
"Shipment saved, but customer update could not be recorded.";

}

else{

document.getElementById("output")
.textContent =
editingId
? "Shipment updated and customer update published!"
: "Shipment saved and customer update published!";

}

}

else{

document.getElementById("output")
.textContent =
editingId
? "Shipment updated successfully!"
: "Shipment saved successfully!";

}


/* CLEAR FORM */

document.getElementById("editingId")
.value="";

document.getElementById("customerMessage")
.value="";


await loadShipments();

}


/* =========================
LOAD SHIPMENTS
========================= */

async function loadShipments(){

const list =
document.getElementById(
"shipmentList"
);

list.textContent =
"Loading shipments...";

const {
data,
error
} =
await supabaseClient
.from("shipments")
.select(
"id, Tracking, Origin, Destination, Status, delivery"
)
.order(
"id",
{
ascending:false
}
);

if(error){

list.textContent =
"Could not load shipments: " +
error.message;

return;

}

if(!data ||
data.length===0){

list.textContent =
"No shipments yet.";

return;

}


list.innerHTML =
data.map(
shipment => `

<div
class="shipment"
id="shipment-${shipment.id}"
>

<strong>
Tracking:
</strong>

${escapeHtml(shipment.Tracking)}

<br>

<strong>
Origin:
</strong>

${escapeHtml(shipment.Origin)}

<br>

<strong>
Destination:
</strong>

${escapeHtml(shipment.Destination)}

<br>

<strong>
Status:
</strong>

${escapeHtml(shipment.Status)}

<br>

<strong>
Delivery:
</strong>

${escapeHtml(shipment.delivery)}

<br><br>


<button
class="edit"
onclick="editShipment('${shipment.id}')"
>
Edit
</button>


<button
class="delete"
onclick="deleteShipment('${shipment.id}')"
>
Delete
</button>


<button
class="history-button"
onclick="toggleHistory('${shipment.id}','${escapeJs(shipment.Tracking)}')"
>
View History
</button>


<div
id="history-${shipment.id}"
class="history hidden"
></div>

</div>

`
).join("");

}


/* =========================
VIEW HISTORY
========================= */

async function toggleHistory(id,tracking){

const historyBox =
document.getElementById(
"history-"+id
);

if(!historyBox){
return;
}

if(!historyBox.classList.contains("hidden")){

historyBox.classList.add("hidden");

historyBox.innerHTML="";

return;

}

historyBox.classList.remove("hidden");

historyBox.innerHTML=`

<div class="history-loading">
Loading shipment history...
</div>

`;


const {
data,
error
} =
await supabaseClient
.from("shipment_history")
.select(
"status, note, created_at"
)
.eq(
"tracking",
tracking
)
.order(
"created_at",
{
ascending:true
}
);


if(error){

historyBox.innerHTML=`

<div class="history-error">
Unable to load shipment history.
</div>

`;

return;

}


if(!data ||
data.length===0){

historyBox.innerHTML=`

<div>
No shipment history recorded yet.
</div>

`;

return;

}


historyBox.innerHTML=`

<div class="history-title">
Customer Updates & Shipment History
</div>

${
data.map(item=>{

const date =
item.created_at
? new Date(
item.created_at
).toLocaleString()
:"";

return `

<div class="history-item">

<div class="history-date">
${escapeHtml(date)}
</div>

<div class="history-status">
${escapeHtml(
item.status ||
"Shipment Update"
)}
</div>

<div class="history-note">
${escapeHtml(
item.note ||
"Shipment status updated."
)}
</div>

</div>

`;

}).join("")
}

`;

}


/* =========================
EDIT
========================= */

async function editShipment(id){

const {
data,
error
} =
await supabaseClient
.from("shipments")
.select(
"id, Tracking, Origin, Destination, Status, delivery"
)
.eq("id",id)
.single();


if(error){

alert(
"Could not load shipment: " +
error.message
);

return;

}


document.getElementById("editingId")
.value=data.id;

document.getElementById("tracking")
.value=data.Tracking || "";

document.getElementById("origin")
.value=data.Origin || "";

document.getElementById("destination")
.value=data.Destination || "";

document.getElementById("status")
.value=data.Status ||
"Shipment Created";

document.getElementById("delivery")
.value=data.delivery || "";


/*
Clear the customer message
when opening an existing shipment.
*/

document.getElementById(
"customerMessage"
).value="";


document.getElementById("output")
.textContent =
"Editing shipment " +
data.Tracking;


window.scrollTo({

top:0,

behavior:"smooth"

});

}


/* =========================
DELETE
========================= */

async function deleteShipment(id){

const confirmed =
confirm(
"Are you sure you want to delete this shipment?"
);

if(!confirmed){
return;
}


const {
error
} =
await supabaseClient
.from("shipments")
.delete()
.eq("id",id);


if(error){

alert(
"Could not delete shipment: " +
error.message
);

return;

}


document.getElementById("output")
.textContent =
"Shipment deleted successfully!";

await loadShipments();

}


/* =========================
SECURITY
========================= */

function escapeHtml(value){

if(
value===null ||
value===undefined
){

return "";

}

return String(value)

.replace(
/&/g,
"&amp;"
)

.replace(
/</g,
"&lt;"
)

.replace(
/>/g,
"&gt;"
)

.replace(
/"/g,
"&quot;"
)

.replace(
/'/g,
"&#039;"
);

}


/* =========================
ESCAPE JS
========================= */

function escapeJs(value){

if(
value===null ||
value===undefined
){

return "";

}

return String(value)

.replace(
/\\/g,
"\\\\"
)

.replace(
/'/g,
"\\'"
)

.replace(
/"/g,
'\\"'
)

.replace(
/\n/g,
"\\n"
)

.replace(
/\r/g,
"\\r"
);

}


/* =========================
SESSION
========================= */

async function checkSession(){

const {
data
} =
await supabaseClient.auth
.getSession();


if(data.session){

document.getElementById(
"loginCard"
)
.classList
.add("hidden");

document.getElementById(
"adminArea"
)
.classList
.remove("hidden");

await loadShipments();

}

}


/* =========================
START
========================= */

checkSession();

</script>

</body>
</html>
