<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>UNEX Global Logistics - Admin</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
body{
font-family:Arial,sans-serif;
background:#f4f7fb;
margin:0;
padding:20px;
color:#222;
}
.container{
max-width:750px;
margin:auto;
}
.card{
background:white;
padding:25px;
border-radius:12px;
margin-bottom:20px;
box-shadow:0 3px 12px rgba(0,0,0,.08);
}
h1,h2{
margin-top:0;
color:#0A3D91;
}
input,select{
width:100%;
padding:12px;
margin:8px 0 15px;
box-sizing:border-box;
border:1px solid #ccc;
border-radius:7px;
font-size:16px;
}
button{
padding:12px 18px;
border:none;
border-radius:7px;
cursor:pointer;
font-size:16px;
margin-right:8px;
margin-top:5px;
}
.primary{
background:#0b63ce;
color:white;
width:100%;
}
.edit{
background:#f0ad00;
color:white;
}
.delete{
background:#d93025;
color:white;
}
.logout{
background:#555;
color:white;
width:100%;
margin-top:15px;
}
.refresh{
background:#0A3D91;
color:white;
width:100%;
margin-bottom:15px;
}
.shipment{
border:1px solid #ddd;
padding:15px;
margin:12px 0;
border-radius:10px;
background:#fafafa;
}
#output{
margin-top:15px;
font-weight:bold;
}
.hidden{
display:none;
}
/* DASHBOARD STATS */
.stats{
display:grid;
grid-template-columns:1fr 1fr;
gap:12px;
margin-bottom:20px;
}
.stat{
background:#0A3D91;
color:white;
padding:20px;
border-radius:10px;
text-align:center;
}
.stat-number{
font-size:30px;
font-weight:bold;
margin-bottom:5px;
}
.stat-label{
font-size:14px;
}
/* SEARCH */
.search-box{
margin-bottom:15px;
}
.no-results{
text-align:center;
padding:20px;
color:#666;
}
</style>
</head>
<body>
<div class="container">
<!-- LOGIN -->
<div id="loginCard" class="card">
<h1>UNEX Admin</h1>
<p>Login to manage shipments.</p>

Email

<input
type=“email”
id=“email”
placeholder=“Admin email”

Password

<input
type=“password”
id=“password”
placeholder=“Password”

Login

</button>
<div id="loginMessage"></div>
</div>
<!-- ADMIN AREA -->
<div id="adminArea" class="hidden">
<!-- DASHBOARD -->
<div class="card">
<h1>UNEX Admin Dashboard</h1>
<div class="stats">
<div class="stat">
<div
class="stat-number"
id="totalShipments">
0
</div>
<div class="stat-label">
Total Shipments
</div>
</div>
<div class="stat">
<div
class="stat-number"
id="activeShipments">
0
</div>
<div class="stat-label">
Active Shipments
</div>
</div>
</div>
</div>
<!-- SHIPMENT FORM -->
<div class="card">
<h2>Manage Shipment</h2>

<input
type=“hidden”
id=“editingId”

Tracking Number

<input
type=“text”
id=“tracking”
placeholder=“Example: 223344”

Origin

<input
type=“text”
id=“origin”
placeholder=“Example: New York”

Destination

<input
type=“text”
id=“destination”
placeholder=“Example: Germany”

Status

<select id="status">
<option value="Shipment Created">
Shipment Created
</option>
<option value="In Transit">
In Transit
</option>
<option value="Arrived at Facility">
Arrived at Facility
</option>
<option value="Held at Customs">
Held at Customs
</option>
<option value="Out for Delivery">
Out for Delivery
</option>
<option value="Delivered">
Delivered
</option>
</select>

Estimated Delivery

<input
type=“text”
id=“delivery”
placeholder=“Example: 03/04/2026”

Save Shipment

</button>

Logout

</button>
<div id="output"></div>
</div>
<!-- SHIPMENTS -->
<div class="card">
<h2>Shipments</h2>
<!-- SEARCH -->

<input
class=“search-box”
type=“text”
id=“searchInput”
placeholder=“Search tracking, origin or destination…”
oninput=“filterShipments()”

<!-- STATUS FILTER -->

<select
id=“statusFilter”
onchange=“filterShipments()”

<option value="all">
All Statuses
</option>
<option value="Shipment Created">
Shipment Created
</option>
<option value="In Transit">
In Transit
</option>
<option value="Arrived at Facility">
Arrived at Facility
</option>
<option value="Held at Customs">
Held at Customs
</option>
<option value="Out for Delivery">
Out for Delivery
</option>
<option value="Delivered">
Delivered
</option>
</select>

🔄 Refresh Shipments

</button>
<div id="shipmentList">
Loading shipments...
</div>
</div>
</div>
</div>
<script>
/* =========================
SUPABASE
========================= */
const SUPABASE_URL =
"https://kwmverimbcosdshjvshc.supabase.co";
const SUPABASE_PUBLISHABLE_KEY =
"sb_publishable_Y_9BOh5Hmb-Zf-rrflPKzw_WV9_Rd5A";
const supabaseClient =
window.supabase.createClient(
SUPABASE_URL,
SUPABASE_PUBLISHABLE_KEY
);
/* =========================
GLOBAL SHIPMENTS
========================= */
let allShipments = [];
/* =========================
LOGIN
========================= */
async function loginAdmin(){
const email =
document.getElementById("email")
.value.trim();
const password =
document.getElementById("password")
.value;
const message =
document.getElementById("loginMessage");
if(!email || !password){
message.textContent =
"Please enter your email and password.";
return;
}
message.textContent =
"Logging in...";
const {data,error} =
await supabaseClient.auth
.signInWithPassword({
email:email,
password:password
});
if(error){
message.textContent =
"Login failed: " +
error.message;
return;
}
if(!data.session){
message.textContent =
"Login failed. No session created.";
return;
}
message.textContent="";
document.getElementById("loginCard")
.classList.add("hidden");
document.getElementById("adminArea")
.classList.remove("hidden");
await loadShipments();
}
/* =========================
LOGOUT
========================= */
async function logoutAdmin(){
await supabaseClient.auth.signOut();
document.getElementById("adminArea")
.classList.add("hidden");
document.getElementById("loginCard")
.classList.remove("hidden");
document.getElementById("shipmentList")
.innerHTML="";
document.getElementById("output")
.textContent="";
document.getElementById("email")
.value="";
document.getElementById("password")
.value="";
}
/* =========================
SAVE SHIPMENT
========================= */
async function saveShipment(){
const editingId =
document.getElementById("editingId")
.value;
const tracking =
document.getElementById("tracking")
.value.trim();
const origin =
document.getElementById("origin")
.value.trim();
const destination =
document.getElementById("destination")
.value.trim();
const status =
document.getElementById("status")
.value;
const delivery =
document.getElementById("delivery")
.value.trim();
if(!tracking){
alert(
"Please enter a tracking number."
);
return;
}
if(!origin || !destination){
alert(
"Please enter the origin and destination."
);
return;
}
const shipment={
Tracking:tracking,
Origin:origin,
Destination:destination,
Status:status,
delivery:delivery
};
let result;
if(editingId){
result =
await supabaseClient
.from("shipments")
.update(shipment)
.eq("id",editingId)
.select();
}else{
result =
await supabaseClient
.from("shipments")
.upsert(
[shipment],
{
onConflict:"Tracking"
}
)
.select();
}
if(result.error){
alert(
"Could not save shipment: " +
result.error.message
);
return;
}
document.getElementById("output")
.textContent =
editingId
?
"Shipment updated successfully!"
:
"Shipment saved successfully!";
document.getElementById("editingId")
.value="";
await loadShipments();
}
/* =========================
LOAD SHIPMENTS
========================= */
async function loadShipments(){
const list =
document.getElementById("shipmentList");
list.textContent =
"Loading shipments...";
const {data,error} =
await supabaseClient
.from("shipments")
.select(
"id, Tracking, Origin, Destination, Status, delivery"
)
.order(
"id",
{ascending:false}
);
if(error){
list.textContent =
"Could not load shipments: " +
error.message;
return;
}
allShipments =
data || [];
updateStats();
filterShipments();
}
/* =========================
STATS
========================= */
function updateStats(){
const total =
allShipments.length;
const active =
allShipments.filter(
shipment =>
shipment.Status !== "Delivered"
).length;
document.getElementById(
"totalShipments"
).textContent =
total;
document.getElementById(
"activeShipments"
).textContent =
active;
}
/* =========================
FILTER
========================= */
function filterShipments(){
const search =
document.getElementById("searchInput")
.value
.toLowerCase()
.trim();
const selectedStatus =
document.getElementById("statusFilter")
.value;
const filtered =
allShipments.filter(
shipment => {
const matchesSearch =
String(shipment.Tracking || "")
.toLowerCase()
.includes(search)
||
String(shipment.Origin || "")
.toLowerCase()
.includes(search)
||
String(shipment.Destination || "")
.toLowerCase()
.includes(search);
const matchesStatus =
selectedStatus === "all"
||
shipment.Status === selectedStatus;
return matchesSearch &&
matchesStatus;
});
displayShipments(filtered);
}
/* =========================
DISPLAY SHIPMENTS
========================= */
function displayShipments(shipments){
const list =
document.getElementById("shipmentList");
if(!shipments.length){
list.innerHTML = `
<div class="no-results">
No shipments found.
</div>
`;
return;
}
list.innerHTML =
shipments.map(
shipment => `
<div class="shipment">
<strong>Tracking:</strong>
${escapeHtml(shipment.Tracking)}
<br>
<strong>Origin:</strong>
${escapeHtml(shipment.Origin)}
<br>
<strong>Destination:</strong>
${escapeHtml(shipment.Destination)}
<br>
<strong>Status:</strong>
${escapeHtml(shipment.Status)}
<br>
<strong>Delivery:</strong>
${escapeHtml(shipment.delivery)}
<br><br>
<button
class="edit"
onclick="editShipment('${shipment.id}')">
Edit
</button>
<button
class="delete"
onclick="deleteShipment('${shipment.id}')">
Delete
</button>
</div>
`
).join("");
}
/* =========================
EDIT
========================= */
async function editShipment(id){
const {data,error} =
await supabaseClient
.from("shipments")
.select(
"id, Tracking, Origin, Destination, Status, delivery"
)
.eq("id",id)
.single();
if(error){
alert(
"Could not load shipment: " +
error.message
);
return;
}
document.getElementById("editingId")
.value=data.id;
document.getElementById("tracking")
.value=data.Tracking || "";
document.getElementById("origin")
.value=data.Origin || "";
document.getElementById("destination")
.value=data.Destination || "";
document.getElementById("status")
.value=data.Status ||
"Shipment Created";
document.getElementById("delivery")
.value=data.delivery || "";
document.getElementById("output")
.textContent =
"Editing shipment " +
data.Tracking;
window.scrollTo({
top:0,
behavior:"smooth"
});
}
/* =========================
DELETE
========================= */
async function deleteShipment(id){
const confirmed =
confirm(
"Are you sure you want to delete this shipment?"
);
if(!confirmed){
return;
}
const {error} =
await supabaseClient
.from("shipments")
.delete()
.eq("id",id);
if(error){
alert(
"Could not delete shipment: " +
error.message
);
return;
}
document.getElementById("output")
.textContent =
"Shipment deleted successfully!";
await loadShipments();
}
/* =========================
ESCAPE HTML
========================= */
function escapeHtml(value){
if(
value === null ||
value === undefined
){
return "";
}
return String(value)
.replace(/&/g,"&amp;")
.replace(/</g,"&lt;")
.replace(/>/g,"&gt;")
.replace(/"/g,"&quot;")
.replace(/'/g,"&#039;");
}
/* =========================
CHECK SESSION
========================= */
async function checkSession(){
const {data} =
await supabaseClient
.auth
.getSession();
if(data.session){
document.getElementById("loginCard")
.classList.add("hidden");
document.getElementById("adminArea")
.classList.remove("hidden");
await loadShipments();
}
}
checkSession();
</script>
</body>
</html>
